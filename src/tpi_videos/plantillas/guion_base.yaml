# ─────────────────────────────────────────────────────────────────────────────
#  GUION DE VIDEO · Tu Profe Industrial
#  1) Cambia los textos de abajo por tu ejercicio.
#  2) Revisa:  ./tpi revisar guiones/ESTE_ARCHIVO.yaml
#  3) Crea:    ./tpi crear guiones/ESTE_ARCHIVO.yaml --borrador   (rápido, para revisar)
#              ./tpi crear guiones/ESTE_ARCHIVO.yaml              (final, para publicar)
#
#  Reglas de oro:
#  • Textos entre comillas dobles "…"; fórmulas LaTeX entre comillas SIMPLES '…'.
#  • "texto" / "tex" es lo que se VE; "voz" es lo que se ESCUCHA (escríbelo como lo dirías:
#    "nueve coma ocho metros por segundo al cuadrado", no "9,8 m/s²").
#  • Frases cortas (máx. ~15 palabras). Una idea por frase.
#  • Coma decimal chilena: escribe 9,8 en la fórmula; el motor la acomoda solo.
#  • Emojis 3D: campo «emoji» (ver ./tpi emojis). Nunca dentro de «voz»: se leerían en voz alta.
#  • Guía completa: docs/GUIA_GUIONES.md
# ─────────────────────────────────────────────────────────────────────────────

titulo: "Título corto del ejercicio"
materia: matematica          # matematica | fisica | ingenieria
nivel: "1° medio / PAES"     # nivel académico o PAES
molde: mito_realidad         # Modo Bestia: mito vs realidad de alta retención
camara: suave                # Modo Bestia: cámara dinámica con seguimiento y zoom

# Los primeros 3 segundos: gancho de dolor o error típico
gancho:
  texto: "¿Por qué casi todos se equivocan en este cálculo?"
  voz: "¿Por qué casi todos cometen este grave error en la prueba?"
  emoji: "🚨"
  # tex: '...'

enunciado:
  texto: "Enunciado claro del problema planteando la situación."
  voz: "Planteamiento directo y sin rodeos en una o dos frases."
  destacar: []

datos: []

pasos:
  - nota: "La creencia falsa"
    tex: 'x = \text{error}'
    voz: "El error común es creer esto. ¡Eso está mal!"
    error: true
    emoji: "❌"
  - nota: "Forma correcta"
    tex: 'x = \text{correcto}'
    voz: "La forma correcta de resolverlo es esta."
    emoji: "💡"

resultado:
  tex: 'x = \text{resultado}'
  voz: "El resultado correcto es este."
  emoji: "🎯"

verificacion:
  texto: "Comprobación rápida que demuestra por qué tiene sentido."
  voz: "Comprobamos por qué tiene sentido y no se te olvidará más."

reto:
  texto: "¿Y si cambiamos este dato? Deja tu respuesta abajo."
  voz: "Ahora tú: ¿cuánto daría si cambiamos este número? Te leo en los comentarios."
  emoji: "🤔"

cierre:
  texto: "Clases particulares PAES M1. Escríbeme al WhatsApp de mi perfil."
  voz: "Si quieres preparar la PAES M1 y asegurar tu puntaje, háblame directo al WhatsApp que está en mi perfil."
  emoji: "🔥"
