# Familia Consola neón · RETO (molde «Reto»).
# La pizarra de liceo de Tiza verde, con neón verde. Pasos numerados y panel para seguir el
# intento; el resultado sale tapado (receta de rodaje del reto) para invitar a resolverlo.
nombre: Consola · Reto
descripcion: 'Pizarra verde de liceo con neón: pasos numerados y la respuesta tapada para que lo intentes.'
rotulo: RETO
marco: pizarra
resplandor: true
colores:
  fondo: '#0A1612'
  panel: '#11221B'
  borde: '#24463A'
  titulos: '#F5F7FA'
  texto: '#F5F7FA'
  formulas: '#F5F7FA'
  tenue: '#8FA89C'
  acento: '#4ADE80'
  exito: '#22C55E'
  cuadricula: '#4ADE80'
  error: '#EF4444'
materias: {matematica: '#4ADE80', fisica: '#4ADE80', ingenieria: '#4ADE80'}
tipografia:
