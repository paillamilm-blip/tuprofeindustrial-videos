# Familia Consola · RETO (molde Reto).
# Versión sobria (12-11-2026): fondo grafito liso con un degradado suave, sin rejas ni viñetas, sin
# brillo neón y con un solo acento apagado por variante. Se conservan la estructura (pasos
# numerados, panel, mapa de color), el plumón y los subtítulos de 3 palabras.
nombre: Consola · Reto
descripcion: 'Grafito verdoso con un verde salvia: pasos numerados y la respuesta tapada para que lo intentes.'
rotulo: RETO
marco: pizarra
resplandor: false
colores:
  fondo: '#0F1411'
  panel: '#18221D'
  borde: '#2D4036'
  titulos: '#ECEFF3'
  texto: '#E4E7EB'
  formulas: '#F2F4F7'
  tenue: '#8FA096'
  acento: '#7DB894'
  exito: '#7DB894'
  cuadricula: '#6FA8DC'  # el segundo color de los dibujos (otra porción, el coseno, el agua): nunca igual al acento
  error: '#D27A72'
materias: {matematica: '#7DB894', fisica: '#7DB894', ingenieria: '#7DB894'}
tipografia:
  titulos: {familia: Montserrat, grosor: HEAVY, mayusculas: true}
  texto: {familia: Montserrat, grosor: SEMIBOLD}
nota: {rol: texto, escala: 1.0, color: acento}
formulas_negrita: true
fondo: {tipo: degradado, degradado: ['#151C18', '#0B0F0D']}
subtitulos:
  fuente: Montserrat Black
  tamano: 84
  color: '#FFFFFF'
  color_activo: '#7DB894'
  borde: 6
  sombra: 2
  posicion_y: 0.82  # con el panel abajo, el motor la sube sola por encima de él
  mayusculas: true
  max_palabras: 3
  max_caracteres: 18
  resaltar: true
animacion: {titulos: plumon}
emojis: true
layout:
  banda_subtitulo: 0.28
  banda_panel: 1.6
  y_zona_pasos: -2.2
gramatica:
  tabs: true
  panel: true
  mapa_color: true
  micro: true
  paleta_pasos: ['#7DB894', '#6FA8DC', '#D4B26A', '#A399C9', '#C98FA7', '#D29A6E']
