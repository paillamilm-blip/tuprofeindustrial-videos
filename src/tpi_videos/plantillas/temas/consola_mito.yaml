# Familia Consola · MITO (molde Mito vs realidad).
# Versión sobria (12-11-2026): fondo grafito liso con un degradado suave, sin rejas ni viñetas, sin
# brillo neón y con un solo acento apagado por variante. Se conservan la estructura (pasos
# numerados, panel, mapa de color), el plumón y los subtítulos de 3 palabras.
nombre: Consola · Mito
descripcion: 'Grafito con un lila apagado: el mito arriba, la realidad abajo y la respuesta tapada.'
rotulo: MITO
marco: pizarra
resplandor: false
colores:
  fondo: '#121118'
  panel: '#1E1B26'
  borde: '#36324A'
  titulos: '#ECEFF3'
  texto: '#E4E7EB'
  formulas: '#F2F4F7'
  tenue: '#9893A8'
  acento: '#A399C9'
  exito: '#7DB894'
  cuadricula: '#A399C9'
  error: '#D27A72'
materias: {matematica: '#A399C9', fisica: '#A399C9', ingenieria: '#A399C9'}
tipografia:
  titulos: {familia: Montserrat, grosor: HEAVY, mayusculas: true}
  texto: {familia: Montserrat, grosor: SEMIBOLD}
nota: {rol: texto, escala: 1.0, color: acento}
formulas_negrita: true
fondo: {tipo: degradado, degradado: ['#18161F', '#0D0C11']}
subtitulos:
  fuente: Montserrat Black
  tamano: 84
  color: '#FFFFFF'
  color_activo: '#A399C9'
  borde: 6
  sombra: 2
  posicion_y: 0.74
  mayusculas: true
  max_palabras: 3
  max_caracteres: 18
  resaltar: true
animacion: {titulos: plumon}
emojis: true
gramatica:
  mapa_color: true
