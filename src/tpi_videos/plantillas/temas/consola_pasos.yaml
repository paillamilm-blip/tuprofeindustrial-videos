# Familia Consola neón · PASO A PASO (molde POV y guiones sin molde).
# Lo mejor de cada estilo antiguo: la gramática XCris de Consola neón (pasos numerados, panel de
# progreso, mapa de color, micro-movimiento), el brillo de Neón sobre reja, el plumón de la Hoja de
# desarrollo, la reja cian de Neón cian y los subtítulos CapCut de 3 palabras. (La lámina de Plano
# nocturno traía un cajetín dibujado que asomaba detrás del panel de progreso.)
nombre: Consola · Paso a paso
descripcion: 'Reja neón en cian: pasos numerados y panel que acumula, para seguir el desarrollo.'
rotulo: PASO A PASO
marco: pizarra
resplandor: true
colores:
  fondo: '#0A1016'
  panel: '#121A24'
  borde: '#2A3A4C'
  titulos: '#F5F7FA'
  texto: '#F5F7FA'
  formulas: '#F5F7FA'
  tenue: '#8A94A6'
  acento: '#38BDF8'
  exito: '#22C55E'
  cuadricula: '#38BDF8'
  error: '#EF4444'
materias: {matematica: '#38BDF8', fisica: '#38BDF8', ingenieria: '#38BDF8'}
tipografia:
  titulos: {familia: Montserrat, grosor: HEAVY, mayusculas: true}
  texto: {familia: Montserrat, grosor: SEMIBOLD}
nota: {rol: texto, escala: 1.0, color: acento}
