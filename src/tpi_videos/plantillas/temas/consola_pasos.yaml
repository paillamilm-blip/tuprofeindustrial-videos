# Familia Consola · PASO A PASO (molde POV y guiones sin molde).
# Versión sobria (12-11-2026): fondo grafito liso con un degradado suave, sin rejas ni viñetas, sin
# brillo neón y con un solo acento apagado por variante. Se conservan la estructura (pasos
# numerados, panel, mapa de color), el plumón y los subtítulos de 3 palabras.
nombre: Consola · Paso a paso
descripcion: 'Grafito azulado y un acento azul acero: pasos numerados y panel que acumula.'
rotulo: PASO A PASO
marco: pizarra
resplandor: false
colores:
  fondo: '#0F141A'
  panel: '#18212B'
  borde: '#2C3A48'
  titulos: '#ECEFF3'
  texto: '#E4E7EB'
  formulas: '#F2F4F7'
  tenue: '#8C97A5'
  acento: '#6FA8DC'
  exito: '#7DB894'
  cuadricula: '#6FA8DC'
  error: '#D27A72'
materias: {matematica: '#6FA8DC', fisica: '#6FA8DC', ingenieria: '#6FA8DC'}
tipografia:
  titulos: {familia: Montserrat, grosor: HEAVY, mayusculas: true}
  texto: {familia: Montserrat, grosor: SEMIBOLD}
nota: {rol: texto, escala: 1.0, color: acento}
formulas_negrita: true
fondo: {tipo: degradado, degradado: ['#151C24', '#0C1015']}
subtitulos:
  fuente: Montserrat Black
  tamano: 84
  color: '#FFFFFF'
  color_activo: '#6FA8DC'
  borde: 6
  sombra: 2
  posicion_y: 0.82  # con el panel abajo, el motor la sube sola por encima de él
  mayusculas: true
  max_palabras: 3
  max_caracteres: 18
  resaltar: true
animacion: {titulos: plumon}
emojis: true
layout:
  banda_subtitulo: 0.28
  banda_panel: 1.6
  y_zona_pasos: -2.2
gramatica:
  tabs: true
  panel: true
  mapa_color: true
  micro: true
  paleta_pasos: ['#6FA8DC', '#D4B26A', '#A399C9', '#7DB894', '#C98FA7', '#D29A6E']
