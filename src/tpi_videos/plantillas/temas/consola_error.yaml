# Familia Consola · ERROR (molde Tres errores y guiones con error: true).
# Versión sobria (12-11-2026): fondo grafito liso con un degradado suave, sin rejas ni viñetas, sin
# brillo neón y con un solo acento apagado por variante. Se conservan la estructura (pasos
# numerados, panel, mapa de color), el plumón y los subtítulos de 3 palabras.
nombre: Consola · Error
descripcion: 'Grafito con un rojo ladrillo: el error se tacha sin gritar y la forma correcta queda numerada.'
rotulo: ERROR
marco: pizarra
resplandor: false
colores:
  fondo: '#141012'
  panel: '#211A1C'
  borde: '#3E3134'
  titulos: '#ECEFF3'
  texto: '#E4E7EB'
  formulas: '#F2F4F7'
  tenue: '#A0918F'
  acento: '#D27A72'
  exito: '#7DB894'
  cuadricula: '#6FA8DC'  # el segundo color de los dibujos (otra porción, el coseno, el agua): nunca igual al acento
  error: '#D27A72'
materias: {matematica: '#D27A72', fisica: '#D27A72', ingenieria: '#D27A72'}
tipografia:
  titulos: {familia: Montserrat, grosor: HEAVY, mayusculas: true}
  texto: {familia: Montserrat, grosor: SEMIBOLD}
nota: {rol: texto, escala: 1.0, color: acento}
formulas_negrita: true
fondo: {tipo: degradado, degradado: ['#1B1517', '#0F0C0D']}
subtitulos:
  fuente: Montserrat Black
  tamano: 84
  color: '#FFFFFF'
  color_activo: '#D27A72'
  borde: 6
  sombra: 2
  posicion_y: 0.82  # con el panel abajo, el motor la sube sola por encima de él
  mayusculas: true
  max_palabras: 3
  max_caracteres: 18
  resaltar: true
animacion: {titulos: plumon}
emojis: true
layout:
  banda_subtitulo: 0.28
  banda_panel: 1.6
  y_zona_pasos: -2.2
gramatica:
  tabs: true
  panel: true
  mapa_color: true
  micro: true
  paleta_pasos: ['#D27A72', '#6FA8DC', '#D4B26A', '#A399C9', '#7DB894', '#C98FA7']
