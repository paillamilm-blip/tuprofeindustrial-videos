# Familia Consola · DATO (molde Nadie te enseñó esto).
# Versión sobria (12-11-2026): fondo grafito liso con un degradado suave, sin rejas ni viñetas, sin
# brillo neón y con un solo acento apagado por variante. Se conservan la estructura (pasos
# numerados, panel, mapa de color), el plumón y los subtítulos de 3 palabras.
nombre: Consola · Dato
descripcion: 'Grafito cálido con un dorado mate: el dato sorpresa, limpio y revelado en el momento justo.'
rotulo: DATO
marco: pizarra
resplandor: false
colores:
  fondo: '#13110D'
  panel: '#211D16'
  borde: '#41392A'
  titulos: '#ECEFF3'
  texto: '#E4E7EB'
  formulas: '#F2F4F7'
  tenue: '#A39A88'
  acento: '#D4B26A'
  exito: '#7DB894'
  cuadricula: '#D4B26A'
  error: '#D27A72'
materias: {matematica: '#D4B26A', fisica: '#D4B26A', ingenieria: '#D4B26A'}
tipografia:
  titulos: {familia: Montserrat, grosor: HEAVY, mayusculas: true}
  texto: {familia: Montserrat, grosor: SEMIBOLD}
nota: {rol: texto, escala: 1.0, color: acento}
formulas_negrita: true
fondo: {tipo: degradado, degradado: ['#1A1712', '#0E0C09']}
subtitulos:
  fuente: Montserrat Black
  tamano: 84
  color: '#FFFFFF'
  color_activo: '#D4B26A'
  borde: 6
  sombra: 2
  posicion_y: 0.74
  mayusculas: true
  max_palabras: 3
  max_caracteres: 18
  resaltar: true
animacion: {titulos: plumon}
emojis: true
gramatica:
  mapa_color: true
