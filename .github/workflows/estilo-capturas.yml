name: Capturas del estilo

# Temporal: prueba con Playwright que el estilo se elige en un solo lugar (QC) y renderiza un sugerido.

on:
  pull_request:

jobs:
  capturas:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: TeX, FFmpeg, el motor y Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended dvisvgm \
            ffmpeg pkg-config libcairo2-dev libpango1.0-dev
          python -m pip install --upgrade pip
          pip install -e . playwright
          python -m playwright install --with-deps chromium

      - name: El estilo que le toca a cada guion del repo
        run: |
          python - <<'EOF'
          from pathlib import Path
          from tpi_videos.config import cargar_marca
          from tpi_videos.guion import cargar_guion
          from tpi_videos.temas import estilo_del_guion, sugerir_tema_de_guion
          marca = cargar_marca()
          print(f"{'guion':52} {'materia':10} {'sale con':20} {'sugerido':20} razón")
          for ruta in sorted(Path("guiones").glob("*.yaml")):
              g = cargar_guion(ruta)
              e, s = estilo_del_guion(g, marca), sugerir_tema_de_guion(g, marca)
              print(f"{ruta.stem[:52]:52} {g.materia:10} {e.clave:20} {s.clave:20} {s.razon}")
          EOF

      - name: Render del sugerido para un error de matemática (Cuaderno con sello)
        run: |
          tpi crear guiones/el_error_clasico_con_pitagoras.yaml --borrador --voz silencio
          grep '"tema_clave"' salida/el-error-clasico-con-pitagoras/linea_de_tiempo.json
          mkdir -p capturas
          python - <<'EOF'
          from pathlib import Path
          from tpi_videos.postproduccion import extraer_cuadro, duracion
          v = Path("salida/el-error-clasico-con-pitagoras/el-error-clasico-con-pitagoras_borrador.mp4")
          d = duracion(v)
          for i, t in enumerate((3.0, d * 0.35, d * 0.6)):
              extraer_cuadro(v, t, Path(f"capturas/render_{i}.jpg"))
          print("duración", d)
          EOF

      - name: Recorrido del panel
        run: |
          tpi panel --no-abrir --puerto 8765 > /tmp/panel.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          python - <<'EOF'
          import time
          from pathlib import Path
          from urllib.parse import quote
          from playwright.sync_api import sync_playwright

          URL = "http://127.0.0.1:8765"
          MOHR = Path("guiones/el_circulo_de_mohr.yaml").resolve()
          with sync_playwright() as p:
              b = p.chromium.launch()
              pag = b.new_page(viewport={"width": 1440, "height": 1100})
              errores = []
              pag.on("pageerror", lambda e: errores.append(str(e)))

              def toma(nombre):
                  time.sleep(1.2)
                  pag.screenshot(path=f"capturas/{nombre}.png")

              # 1 · el único lugar: la ficha del guion en QC, abierta desde un enlace
              pag.goto(f"{URL}/qc?guion={quote(str(MOHR))}")
              bloque = pag.locator(".tpi-consola", has_text="Estilo del video").first
              bloque.wait_for(timeout=20000)
              print("bloque:", bloque.inner_text().replace("\n", " | "))
              toma("01_qc_estilo_sugerido")

              # 2 · el selector
              bloque.click()
              pag.wait_for_selector(".q-dialog .tpi-ficha")
              tiles = pag.locator(".q-dialog .tpi-ficha")
              print("estilos en el selector:", tiles.count())
              print("primero:", tiles.first.inner_text().replace("\n", " | "))
              toma("02_selector")

              # 3 · elegir otro: se escribe «tema:» en el guion
              pag.locator(".q-dialog .tpi-ficha", has_text="Kraft claro").first.click()
              time.sleep(1.5)
              print("YAML tras elegir Kraft claro:", [l for l in MOHR.read_text().splitlines() if l.startswith("tema:")])
              bloque = pag.locator(".tpi-consola", has_text="Estilo del video").first
              print("bloque:", bloque.inner_text().replace("\n", " | "))
              toma("03_elegido_por_ti")

              # 4 · volver al sugerido: se borra la línea
              bloque.click()
              pag.wait_for_selector(".q-dialog .tpi-ficha")
              pag.locator(".q-dialog .tpi-ficha", has_text="★ sugerido").first.click()
              time.sleep(1.5)
              print("YAML tras volver al sugerido:", [l for l in MOHR.read_text().splitlines() if l.startswith("tema:")])

              # 5 · en las otras pantallas ya no se elige: se informa y se manda a QC
              pag.goto(URL + "/")
              pag.wait_for_selector("text=Así está armado", timeout=20000)
              fila = pag.locator("div.border-t", has_text="Estilo").first
              print("tarjeta Un video:", fila.inner_text().replace("\n", " | "))
              print("enlace cambiar →", fila.locator("a").first.get_attribute("href"))
              comando = pag.locator("text=/^tpi producir/").first.inner_text()
              print("comando lleva --estilo:", "--estilo" in comando)
              toma("04_un_video")

              pag.goto(URL + "/ajustes")
              tarjeta = pag.locator(".q-card", has_text="Estilo de cada video").first
              tarjeta.wait_for(timeout=20000)
              tarjeta.scroll_into_view_if_needed()
              print("ajustes:", tarjeta.inner_text().replace("\n", " | ")[:400])
              toma("05_ajustes")

              pag.goto(URL + "/estilos")
              pag.wait_for_selector("text=Neón cian", timeout=30000)
              print("chips de estilos:", sorted({c.inner_text() for c in pag.locator(".q-chip").all() if "★" in c.inner_text()}))
              print("botón «Usar siempre» presente:", pag.get_by_text("Usar siempre").count())
              toma("06_estilos")

              pag.goto(f"{URL}/crear?guion={quote(str(MOHR))}")
              pag.wait_for_selector("text=Estilo: el sugerido para este video", timeout=30000)
              print("editor: sin selector de estilo:", pag.locator("label", has_text="Estilo").count() == 0)
              toma("07_editor")
              print("errores de la página:", errores or "ninguno")
              b.close()
          EOF
          grep -i "traceback" -A12 /tmp/panel.log | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-estilo
          path: capturas
          retention-days: 7
