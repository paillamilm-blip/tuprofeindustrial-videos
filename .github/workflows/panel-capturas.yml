name: Capturas del tablero

# Temporal: levanta el panel, lo recorre con Playwright (las tres pestañas, aprobar un guion y lanzar
# el lote) y sube las capturas. Lo pide la regla del repo para cualquier cambio del panel.

on:
  pull_request:

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TeX, FFmpeg y las librerías de Manim
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended dvisvgm \
            ffmpeg pkg-config libcairo2-dev libpango1.0-dev
      - name: Instalar el motor y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e . playwright
          python -m playwright install --with-deps chromium
      - name: Una cola con algo de historia
        run: |
          # Dos guiones esperando, uno ya terminado: así las tres columnas tienen qué mostrar.
          tpi lote guiones/el_cubo_partido.yaml --solo-encolar
          tpi lote guiones/ejemplos/motor_vivo.yaml --solo-encolar
          python - <<'EOF'
          import json, pathlib
          ruta = pathlib.Path("salida/.cola/trabajos.json")
          datos = json.loads(ruta.read_text())
          lote = datos["lotes"][-1]
          lote["videos"][0].update(estado="listo", fase="listo", avance=1.0)
          lote["estado"] = "listo"
          ruta.write_text(json.dumps(datos, ensure_ascii=False))
          EOF
      - name: Recorrido con Playwright
        run: |
          tpi panel --no-abrir --puerto 8765 > /tmp/panel.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          mkdir -p capturas
          python - <<'EOF'
          import time
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              b = p.chromium.launch()
              pag = b.new_page(viewport={"width": 1440, "height": 1000})
              errores = []
              pag.on("pageerror", lambda e: errores.append(str(e)))
              pag.goto("http://127.0.0.1:8765/")
              pag.wait_for_selector("text=Lanzar Renderización en Lote")
              time.sleep(1.5)
              pag.screenshot(path="capturas/1_cola.png", full_page=True)

              pag.get_by_role("tab", name="Aprobación de Guiones (QC)").click()
              pag.wait_for_selector("text=Lo que dice la voz")
              time.sleep(1)
              pag.screenshot(path="capturas/2_qc.png", full_page=True)
              pag.get_by_text("Detalles técnicos").click()
              time.sleep(1)
              pag.screenshot(path="capturas/3_qc_detalles.png", full_page=True)

              pag.get_by_role("button", name="Aprobar y Enviar a Cola").click()
              pag.wait_for_selector("text=quedó en la cola de producción")
              time.sleep(1)
              pag.screenshot(path="capturas/4_qc_aprobado.png", full_page=True)

              pag.get_by_role("tab", name="Avanzado").click()
              pag.wait_for_selector("text=Crear a mano")
              time.sleep(1)
              pag.screenshot(path="capturas/5_avanzado.png", full_page=True)
              pag.get_by_text("Ajustes y diagnóstico").click()
              time.sleep(3)
              pag.screenshot(path="capturas/6_avanzado_ajustes.png", full_page=True)

              pag.get_by_role("tab", name="Cola de Producción").click()
              time.sleep(2)
              pag.screenshot(path="capturas/7_cola_con_aprobado.png", full_page=True)
              pag.get_by_role("button", name="Lanzar Renderización en Lote").click()
              time.sleep(25)
              pag.screenshot(path="capturas/8_renderizando.png", full_page=True)

              for ruta in ("/crear", "/videos", "/motor", "/qc", "/avanzado"):
                  pag.goto("http://127.0.0.1:8765" + ruta)
                  time.sleep(1.5)
              pag.goto("http://127.0.0.1:8765/crear?guion=guiones/el_cubo_partido.yaml")
              time.sleep(4)
              pag.screenshot(path="capturas/9_editor_desde_qc.png", full_page=True)
              print("errores de la página:", errores or "ninguno")
              b.close()
          EOF
          sleep 2
          cat /tmp/panel.log | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-tablero
          path: capturas
          retention-days: 7
