name: Capturas del tablero

# Temporal: levanta el panel y prueba con Playwright que cada pieza del tablero responda al clic.

on:
  pull_request:

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar el motor y Playwright
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev
          python -m pip install --upgrade pip
          pip install -e . playwright
          python -m playwright install --with-deps chromium
      - name: Datos de muestra
        run: |
          cp guiones/ejemplos/motor_vivo.yaml guiones/zz_con_metadatos.yaml
          cat >> guiones/zz_con_metadatos.yaml <<'EOF'

          metadatos:
            titulo: "¿Dónde deja de bajar la parábola?"
            descripcion: "Tangente, área y un cilindro que se abre. ¿Lo viste venir?"
            hashtags: ["#tuprofeindustrial", "#matematica", "#derivadas"]
          EOF
          tpi lote guiones/el_cubo_partido.yaml --solo-encolar
          tpi lote guiones/ejemplos/fisica_caida_libre.yaml --solo-encolar
          python - <<'EOF'
          import json, pathlib
          ruta = pathlib.Path("salida/.cola/trabajos.json")
          datos = json.loads(ruta.read_text())
          v = datos["lotes"][-1]["videos"][0]
          v.update(estado="fallo", fase="fallo", error="edge-tts no respondió (prueba)")
          ruta.write_text(json.dumps(datos, ensure_ascii=False))
          EOF
      - name: Recorrido de clics
        run: |
          tpi panel --no-abrir --puerto 8765 > /tmp/panel.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          mkdir -p capturas
          python - <<'EOF'
          import time
          from playwright.sync_api import sync_playwright

          URL = "http://127.0.0.1:8765"
          with sync_playwright() as p:
              b = p.chromium.launch()
              ctx = b.new_context(viewport={"width": 1440, "height": 1000}, permissions=["clipboard-read", "clipboard-write"])
              pag = ctx.new_page()
              errores = []
              pag.on("pageerror", lambda e: errores.append(str(e)))

              def toma(nombre):
                  time.sleep(1.2)
                  pag.screenshot(path=f"capturas/{nombre}.png")

              pag.goto(URL + "/")
              pag.wait_for_selector("text=Lanzar Renderización en Lote")
              pag.get_by_text("PENDIENTES", exact=True).first.hover()
              toma("01_hover_cifra")
              pag.get_by_text("PENDIENTES", exact=True).first.click()
              pag.wait_for_selector(".q-dialog")
              toma("02_dialogo_pendientes")
              pag.keyboard.press("Escape")
              time.sleep(0.5)

              pag.get_by_text("El cubo partido").first.click()
              pag.wait_for_selector("text=Producir este ahora")
              toma("03_detalle_ficha")
              pag.keyboard.press("Escape")
              time.sleep(0.5)
              pag.get_by_text("Caída libre").first.click()
              pag.wait_for_selector("text=edge-tts no respondió")
              toma("04_detalle_fallo")
              pag.get_by_role("button", name="Quitar de la cola").click()
              pag.get_by_role("button", name="Sí, quitar").click()
              time.sleep(2)
              toma("05_quitado")

              pag.get_by_text("Guiones por aprobar").click()
              pag.wait_for_selector("text=Lo que dice la voz")
              pag.get_by_text("La pendiente, el área y el cilindro abierto").first.click()
              time.sleep(1)
              toma("06_qc")
              pag.get_by_text("#derivadas").click()
              time.sleep(0.5)
              print("portapapeles tras el hashtag:", pag.evaluate("navigator.clipboard.readText()"))
              toma("07_copiado")
              pag.locator(".tpi-clic", has_text="Gancho").first.click()
              time.sleep(0.5)
              print("portapapeles tras la voz:", pag.evaluate("navigator.clipboard.readText()"))

              pag.get_by_text("Por revisar", exact=False).first.click()
              pag.locator(".tpi-consola.tpi-clic").first.click()
              pag.wait_for_url("**/crear?guion=**")
              time.sleep(3)
              toma("08_editor_desde_titulo")

              pag.get_by_text("TU PROFE INDUSTRIAL").click()
              pag.wait_for_url(URL + "/")
              pag.wait_for_selector("text=Lanzar Renderización en Lote")
              pag.get_by_text("El motor está libre").click()
              time.sleep(3)
              toma("09_lanzado_desde_columna_vacia")
              try:
                  pag.locator(".tpi-consola .tpi-clic").filter(has_text="Video 1").first.click(timeout=5000)
                  toma("10_dialogo_tarea")
              except Exception as e:
                  print("la tarea ya había terminado:", type(e).__name__)
              print("errores de la página:", errores or "ninguno")
              b.close()
          EOF
          tail -20 /tmp/panel.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-clic
          path: capturas
          retention-days: 7
