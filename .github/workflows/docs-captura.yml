name: Captura de docs

# Temporal: mira el HTML regenerado del análisis técnico y el estudio visual en un navegador.

on:
  pull_request:

jobs:
  captura:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: El HTML se regenera igual desde el .md
        run: |
          cp docs/ANALISIS_TECNICO.html /tmp/antes.html
          python3 scripts/doc_a_html.py docs/ANALISIS_TECNICO.md docs/ANALISIS_TECNICO.html
          cmp /tmp/antes.html docs/ANALISIS_TECNICO.html && echo "✅ el HTML del repo está al día con el .md"
      - name: Capturas
        run: |
          mkdir -p capturas
          python - <<'EOF'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); pag = b.new_page(viewport={"width": 1280, "height": 1800})
              errores = []; pag.on("pageerror", lambda e: errores.append(str(e)))
              for nombre in ("ANALISIS_TECNICO", "ESTUDIO_VISUAL_MATEMATICAS"):
                  pag.goto(Path(f"docs/{nombre}.html").resolve().as_uri())
                  pag.wait_for_timeout(800)
                  pag.screenshot(path=f"capturas/{nombre}_inicio.png")
                  if nombre == "ANALISIS_TECNICO":
                      pag.locator("#dependencias-criticas-y-acoplamientos-manuales").scroll_into_view_if_needed()
                      pag.wait_for_timeout(300)
                      pag.screenshot(path=f"capturas/{nombre}_seccion7.png")
                      print("secciones:", pag.locator("section").count(), "· chips:", pag.locator(".chip").count())
              print("errores de la página:", errores or "ninguno")
              b.close()
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs
          path: capturas
          retention-days: 7
