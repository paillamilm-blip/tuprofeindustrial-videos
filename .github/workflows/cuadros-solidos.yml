name: Cuadros de los sólidos industriales

# Temporal, para revisar el PR a ojo: render del ejemplo en borrador sin voz, advertencias del
# registro, cuadros sueltos y la comparación en píxeles de los ejemplos que ya existían.

on:
  pull_request:
    paths:
      - "src/tpi_videos/**"
      - "guiones/ejemplos/**"
      - ".github/workflows/cuadros-solidos.yml"

jobs:
  cuadros:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TeX, FFmpeg y las librerías de Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended dvisvgm \
            ffmpeg pkg-config libcairo2-dev libpango1.0-dev
      - name: Instalar el motor
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Guion de control con los otros tres dibujos
        run: |
          cat > /tmp/otros.yaml <<'EOF'
          titulo: "Tubería, eje y flujo"
          materia: ingenieria
          gancho:
            texto: "¿Por dónde pasa el agua?"
          enunciado:
            texto: "Un ducto con bridas, un eje escalonado y el flujo entre dos placas."
          pasos:
            - tex: 'A = \pi r_i^2'
              voz: "Por dentro del tubo pasa el fluido; las bridas se apartan para verlo."
              visual: {tipo: tuberia_3d, radio: "10 cm", espesor: "1 cm", longitud: "80 cm", despiece: true, anotar: [seccion, material]}
            - tex: 'V = \sum \pi r_k^2 L_k'
              voz: "El eje tiene tres tramos de distinto diámetro, y cada uno suma su cilindro."
              visual: {tipo: eje_3d, radios: [20, 30, 25], largos: [60, 120, 80], unidad: mm, despiece: true, anotar: [volumen, largo]}
            - tex: 'u(y) = 4u_{max}\frac{y}{h}\left(1-\frac{y}{h}\right)'
              voz: "Entre dos placas quietas, empujado por la presión, el fluido termina en una parábola."
              visual: {tipo: perfil_flujo, flujo: poiseuille, velocidad: "2 m/s", separacion: "1 cm", viscosidad: "0,001 Pa·s", anotar: [esfuerzo]}
            - tex: 'u(y) = U\frac{y}{h}'
              voz: "Y si la placa de arriba arrastra el fluido, el perfil queda recto."
              visual: {tipo: perfil_flujo, flujo: couette, velocidad: "2 m/s", separacion: "1 cm"}
          resultado:
            tex: '\tau = \mu \frac{du}{dy}'
            voz: "El esfuerzo cortante sale de la pendiente del perfil."
          EOF
          cp /tmp/otros.yaml guiones/otros_industriales.yaml
      - name: Render en borrador sin voz
        run: |
          mkdir -p cuadros
          set -o pipefail
          tpi crear guiones/ejemplos/solidos_industriales.yaml --borrador --voz silencio 2>&1 | tee cuadros/render_solidos.log
          tpi crear guiones/otros_industriales.yaml --borrador --voz silencio 2>&1 | tee cuadros/render_otros.log
      - name: Advertencias en el registro
        run: |
          if tr '\r' '\n' < cuadros/render_solidos.log | grep -vE "it/s\]" | grep -nEi "warning|traceback|error|⚠"; then
            echo "::warning::El registro del render trae líneas para revisar."
          else
            echo "✅ Sin advertencias ni errores en el registro del ejemplo."
          fi
      - name: Cuadros
        run: |
          for nombre in $(ls salida); do
            video=$(ls salida/$nombre/*_borrador.mp4 2>/dev/null | head -1) || continue
            [ -n "$video" ] || continue
            ffprobe -v error -show_entries stream=width,height,r_frame_rate:format=duration -of default=nw=1 "$video" | tee cuadros/$nombre.txt
            mkdir -p cuadros/$nombre
            ffmpeg -v error -i "$video" -vf "fps=2,scale=270:-1" cuadros/$nombre/c_%03d.png
            cp salida/$nombre/linea_de_tiempo.json cuadros/$nombre/ 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cuadros-solidos
          path: cuadros
          retention-days: 7
