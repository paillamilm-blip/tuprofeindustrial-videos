name: Cuadros del motor vivo

# Temporal, para revisar a ojo el PR del motor visual vivo: renderiza en resolución final, sin voz,
# busca advertencias en el registro y sube cuadros sueltos y una hoja de contactos como artefacto.

on:
  pull_request:
    paths:
      - "src/tpi_videos/**"
      - "guiones/ejemplos/**"
      - ".github/workflows/cuadros-motor-vivo.yml"

jobs:
  cuadros:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: TeX, FFmpeg y las librerías de Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended dvisvgm \
            ffmpeg pkg-config libcairo2-dev libpango1.0-dev

      - name: Instalar el motor
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Render final sin voz (los dos guiones)
        run: |
          mkdir -p cuadros
          set -o pipefail
          tpi crear guiones/ejemplos/visuales_tres_tipos.yaml --voz silencio 2>&1 | tee cuadros/render_visuales_tres_tipos.log
          tpi crear guiones/ejemplos/motor_vivo.yaml --voz silencio 2>&1 | tee cuadros/render_motor_vivo.log

      - name: Advertencias en el registro
        run: |
          if grep -nEi "warning|advertencia|traceback|error" cuadros/render_*.log; then
            echo "::warning::El registro del render trae líneas para revisar (arriba)."
          else
            echo "✅ Sin advertencias ni errores en el registro del render."
          fi

      - name: Cuadros y hoja de contactos
        run: |
          for nombre in visuales-tres-tipos motor-vivo; do
            video=$(ls salida/$nombre/$nombre.mp4)
            ffprobe -v error -show_entries stream=width,height,r_frame_rate:format=duration -of default=nw=1 "$video" | tee cuadros/$nombre.txt
            mkdir -p cuadros/$nombre
            ffmpeg -v error -i "$video" -vf "fps=2,scale=270:-1" cuadros/$nombre/c_%03d.png
            ffmpeg -v error -i "$video" -vf "fps=2,scale=180:-1,tile=10x8" -frames:v 1 cuadros/${nombre}_hoja.png || true
          done
          cp salida/motor-vivo/*.json cuadros/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: cuadros-motor-vivo
          path: cuadros
          retention-days: 7
