name: Verificación de render

# Qué hace: renderiza un guion de ejemplo de verdad, sin claves y sin internet de IA, para que
# un cambio de código no rompa los videos en silencio. No usa secretos: no llama a Gemini ni a edge-tts.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    # Fijo: «ubuntu-latest» pasará a Ubuntu 26 y cambiaría los paquetes de TeX sin avisar.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: TeX, FFmpeg y las librerías de Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended dvisvgm \
            ffmpeg pkg-config libcairo2-dev libpango1.0-dev
      - name: Instalar el motor
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Comprobar que uv.lock sigue al día
        # Si alguien agrega o cambia una dependencia en pyproject.toml sin regenerar el lock, se corta acá.
        run: |
          python -m pip install --quiet uv
          uv lock --check

      - name: Pruebas del motor
        # Cola, hitos, espera de la IA y eventos del panel: sin Manim, sin NiceGUI y sin internet.
        run: python -m unittest discover -s pruebas -t . -v

      - name: Render de un guion de ejemplo
        # El ejemplo más completo: fórmula con LaTeX, gráfico de función, diagrama de fuerzas y circuito.
        # --voz silencio: la voz sintética necesita internet y no es lo que se quiere comprobar acá.
        run: tpi crear guiones/ejemplos/visuales_tres_tipos.yaml --borrador --voz silencio

      - name: Comprobar el video con ffprobe
        run: |
          video=salida/visuales-tres-tipos/visuales-tres-tipos_borrador.mp4
          test -f "$video" || { echo "❌ El motor no dejó el video en $video"; exit 1; }
          lee() { ffprobe -v error -select_streams v:0 -show_entries stream=$1 -of csv=p=0 "$video"; }
          ancho=$(lee width); alto=$(lee height); dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")
          echo "Video: ${ancho}×${alto}, ${dur} s"
          [ "$ancho" = "540" ] && [ "$alto" = "960" ] || { echo "❌ No es vertical 9:16 (540×960)."; exit 1; }
          awk "BEGIN { exit !($dur > 20) }" || { echo "❌ El video dura menos de 20 s: se cortó."; exit 1; }
          echo "✅ El render completo (LaTeX → Manim → subtítulos → volumen) sigue funcionando."

      - name: Clip de gancho (campos «molde» y «gancho_variantes»)
        # Sin voz: los clips del laboratorio se prueban sin internet, igual que el render de arriba.
        run: |
          tpi ganchos guiones/ejemplos/moldes_virales.yaml --sin-voz
          clips=$(find salida/ganchos -name 'gancho-*.mp4' | sort)
          test -n "$clips" || { echo "❌ No salió ningún clip de gancho"; exit 1; }
          for clip in $clips; do
            lee() { ffprobe -v error -select_streams v:0 -show_entries stream=$1 -of csv=p=0 "$clip"; }
            ancho=$(lee width); alto=$(lee height); dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$clip")
            echo "Clip $clip: ${ancho}×${alto}, ${dur} s"
            [ "$ancho" = "540" ] && [ "$alto" = "960" ] || { echo "❌ $clip no es vertical 9:16."; exit 1; }
            awk "BEGIN { exit !($dur >= 3 && $dur <= 6) }" || { echo "❌ $clip dura ${dur} s: fuera de 3–6 s."; exit 1; }
          done
          echo "✅ El laboratorio de ganchos renderiza todos los clips."

  # Portabilidad: la suite en Windows y macOS, sólo para VER los fallos de cada plataforma.
  # No bloquea (continue-on-error): el gate que corta el PR sigue siendo «render» en Ubuntu.
  # Sin TeX en estos equipos: las pruebas que dibujan fórmulas se saltan solas (en Ubuntu sí corren).
  # Si algo se rompe en Mac o Windows, este job lo muestra en cada PR sin frenar las fusiones.
  portabilidad:
    name: Suite en ${{ matrix.os }} (informativa)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      # Windows trae la consola en cp1252 y los emoji de la CLI revientan sin esto.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar el motor
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: "Pruebas del motor (sin TeX: las que lo piden fallan y quedan visibles)"
        run: python -m unittest discover -s pruebas -t . -v
