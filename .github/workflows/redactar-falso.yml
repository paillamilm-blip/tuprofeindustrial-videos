name: Redactar con un Gemini de mentira

# Temporal: corre `tpi redactar` de verdad (CLI, LaTeX, revisión y YAML) contra un servidor local que
# imita a Gemini, y después renderiza cada guion en borrador. No usa ninguna clave real.

on:
  pull_request:
    paths:
      - "src/tpi_videos/redactor.py"
      - "src/tpi_videos/plantillas/ia/**"
      - "pruebas/ia_falsa.py"
      - "scripts/gemini_falso.py"
      - ".github/workflows/redactar-falso.yml"

jobs:
  redactar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:8765
      GEMINI_API_KEY: clave-de-mentira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TeX, FFmpeg y las librerías de Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended dvisvgm \
            ffmpeg pkg-config libcairo2-dev libpango1.0-dev
      - name: Instalar el motor
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Los tres temas
        run: |
          python scripts/gemini_falso.py 8765 > /tmp/gemini.log 2>&1 &
          sleep 2
          mkdir -p redactados
          for tema in "Un balance de masa en una tolva de inyección" \
                      "Cálculo de altura máxima en tiro parabólico" \
                      "Derivada de una función cuadrática paso a paso"; do
            echo "::group::$tema"
            tpi redactar "$tema" 2>&1 | tee -a redactados/registro.txt
            echo "::endgroup::"
          done
          cat /tmp/gemini.log
          ls guiones/*.yaml -t | head -3 | xargs -I{} cp {} redactados/
          for f in redactados/*.yaml; do echo "===== $f"; cat "$f"; done
      - name: Los campos vivos están en los YAML
        run: |
          python - <<'EOF'
          import glob, yaml
          for ruta in sorted(glob.glob("redactados/*.yaml")):
              g = yaml.safe_load(open(ruta, encoding="utf-8"))
              v = next(p["visual"] for p in g["pasos"] if "visual" in p)
              vivos = {k: v[k] for k in ("tipo", "movimiento", "desde", "hasta", "anotar", "despiece") if k in v}
              halos = [p["halo"] for p in g["pasos"] if p.get("halo")]
              cambios = sum(1 for p in g["pasos"] if p.get("resaltar_cambio"))
              print(f"{ruta}: {vivos} · halo {halos} · resaltar_cambio en {cambios} pasos · destello {g['resultado'].get('destello')}")
              assert g["resultado"].get("destello"), ruta
              assert "despiece" in v or "movimiento" in v, ruta
          EOF
      - name: Cada guion redactado renderiza en borrador
        run: |
          for f in redactados/*.yaml; do
            cp "$f" guiones/
            tpi crear "guiones/$(basename "$f")" --borrador --voz silencio 2>&1 | tr '\r' '\n' | grep -E "✅|⚠|Error|Traceback" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: redactados
          path: redactados
          retention-days: 7
