# Identidad visual y sonora de Tu Profe Industrial.
# Todo es opcional: lo que borres vuelve a su valor por defecto.

nombre: "Tu Profe Industrial"
usuario: "@tuprofeindustrial"

# ── Reglas espaciales y visuales del cuadro vertical (9:16) ──────────────────────────────────
# Las aplica el motor en cada video, no son opcionales. Viven en el código y en las pruebas;
# acá quedan escritas para que cualquier guion o agente las respete. (Van como comentario porque
# el lector de marca.yaml no acepta claves nuevas: una clave suelta rompería la carga.)
#
# 1. Base única: todos los videos heredan de VideoEjercicio (escena.py). No hay una base ThreeDScene
#    aparte: el 3D se proyecta en 2D con luz propia para que la cámara y los subtítulos sigan mandando.
# 2. Zonas seguras de TikTok/Reels: el contenido vive en la banda central. Quedan prohibidos el 25%
#    inferior (subtítulo quemado + botones de la app) y el 15% superior (cabecera). Todo dibujo se
#    agrupa y escala al centro con ajustar_a_zona() y reparto_de_intro(): solo achica, nunca agranda,
#    y nunca invade la banda del subtítulo (componentes.py; pruebas test_capas_y_zonas, test_aire_del_dibujo).
# 3. Ancla visual en la intro: junto al texto del enunciado aparece siempre el objeto del ejercicio
#    (su sólido 3D, circuito o gráfico) ANTES de la matemática (ancla_del_enunciado + _enunciado).
#    Si el ejercicio no tiene ningún dibujo, no se inventa un ancla: queda solo el texto.
# 4. Capas por rol: texto y fórmulas (Text/Tex) van en CAPA_TEXTO=10, por encima de cajas y tarjetas
#    (CAPA_CAJA=0). Manim reordena por z_index en cada cuadro: una etiqueta nunca queda tapada por
#    su propio contenedor (componentes.py: texto/parrafo/ecuacion/chip/tarjeta).
# 5. Figuras con volumen: el generador promociona el sólido plano al cuerpo 3D (solido → solido_3d),
#    con caras, luz Lambert y relieve, en vez de un contorno de alambre (redactor.py; dibujos_3d.py).
# 6. El video se juzga viéndolo: fluidez, fotogramas completos y números de los rótulos legibles.

# Estilo de respaldo (ver ./tpi temas). Casi nunca se usa: cada video lleva la variante de la familia
# Consola neón que le toca por su forma de contenido (paso a paso, error, mito, dato o reto), o la que
# elijas en Aprobación de Guiones (QC). Este solo vale cuando no hay guion (vista previa, ./tpi subtitular).
tema: consola_pasos

# ── Colores y subtítulos del tema archivado «pizarra_nocturna» ────────────────────────────────
# (Las variantes de Consola neón traen sus propios colores, letras y subtítulos.)
colores:            # formato #RRGGBB
  fondo: "#0B1220"       # azul noche (pizarra)
  panel: "#121B2F"       # tarjetas
  borde: "#24324F"
  texto: "#F8FAFC"
  tenue: "#94A3B8"
  acento: "#FFC72C"      # amarillo seguridad industrial: destacados y resultado
  exito: "#22C55E"
  cuadricula: "#38BDF8"  # líneas tenues del fondo tipo plano técnico

materias:           # color de la etiqueta de cada materia
  matematica: "#38BDF8"
  fisica: "#FB923C"
  ingenieria: "#FACC15"

voz:
  # gemini (natural, misma clave de Gemini) | edge (neural, gratis, más robótica) | gtts | silencio
  proveedor: gemini
  nombre: "Charon"                # voz de Gemini (ver ./tpi voces --gemini); con edge: es-CL-LorenzoNeural
  # Solo con gemini: cómo tiene que sonar, en palabras. Vacío = profe chileno cercano, con calma.
  estilo: ""
  velocidad: "+5%"

cama:
  activa: true
  volumen: 0.12
  estilo: "motivado"             # Modo Bestia: sintetizador enérgico y continuo por defecto

cierre:
  texto: "Clases particulares PAES M1 · Escríbeme al WhatsApp de mi perfil"
  voz: "Si quieres preparar la PAES M1 y asegurar tu puntaje, háblame directo al WhatsApp que está en mi perfil."
  emoji: ""

subtitulos:         # estilo CapCut
  fuente: "Montserrat Black"
  tamano: 84
  color: "#FFFFFF"
  color_activo: "#FFC72C"   # color de la palabra que se está diciendo
  borde: 7
  sombra: 3
  posicion_y: 0.72          # 0 = arriba, 1 = abajo (0.72 deja libre la zona de botones de la app)
  mayusculas: true
  max_palabras: 4
  max_caracteres: 22
