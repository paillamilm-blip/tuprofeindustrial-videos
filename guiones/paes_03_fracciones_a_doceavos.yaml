titulo: 'PAES M1: ¿Por qué no se suman los denominadores?'
materia: matematica
nivel: 1° medio / PAES
tema: rotulador
gancho:
  texto: 2/3 + 1/4 no es 3/7. ¿Dónde está el error?
  voz: Dos tercios más un cuarto no es tres séptimos. ¿Dónde está el error que muchos
    cometen?
  tex: \frac{2}{3} + \frac{1}{4} \neq \frac{3}{7}
  emoji: 🍕
enunciado:
  texto: Calcula la suma 2/3 + 1/4 encontrando el mínimo común múltiplo entre los
    denominadores.
  voz: Jamás sumes hacia el lado numeradores y denominadores. Solo sumas pedazos del
    mismo tamaño.
  destacar:
  - 2/3 + 1/4
pasos:
- nota: Error típico
  tex: \frac{2 + 1}{3 + 4} = \frac{3}{7}
  voz: Sumar dos más uno y tres más cuatro da tres séptimos, pero en fracciones eso
    está completamente prohibido.
  error: true
  transformar: false
- nota: Mínimo común múltiplo
  tex: \text{mcm}(3, 4) = 12
  voz: 'Buscamos un denominador común: el mínimo común múltiplo entre tres y cuatro
    es doce.'
  emoji: 💡
  transformar: false
- nota: Amplificar a doceavos
  tex: \frac{2 \cdot 4}{3 \cdot 4} + \frac{1 \cdot 3}{4 \cdot 3} = \frac{8}{12} +
    \frac{3}{12}
  voz: 'Amplificamos: dos tercios se convierte en ocho doceavos, y un cuarto en tres
    doceavos.'
  destacar:
  - \frac{8}{12} + \frac{3}{12}
  transformar: false
resultado:
  tex: \frac{8 + 3}{12} = \frac{11}{12}
  voz: Ahora que los pedazos son del mismo porte, sumamos ocho más tres y obtenemos
    once doceavos.
  emoji: ✅
verificacion:
  texto: Solo se pueden sumar fracciones cuando los trozos tienen exactamente el mismo
    tamaño.
  voz: 'Regla de oro: para sumar o restar fracciones necesitas el mismo denominador
    común.'
cierre:
  texto: ¿Repites este error? Trabajémoslo en una clase PAES. Escríbeme PAES por Instagram
    para consultar horarios.
  voz: ¿Repites este error? Trabajémoslo en una clase PAES. Escríbeme PAES por Instagram
    para consultar horarios.
