titulo: 'PAES M1: ¿Por qué 2/3 + 1/4 NO es 3/7?'
materia: matematica
nivel: 1° medio / PAES
molde: mito_realidad
tema: consola_reto
camara: suave
gancho:
  texto: ¡Nunca sumes las fracciones hacia el lado!
  voz: ¡Por favor nunca sumes las fracciones hacia el lado! ¿Por qué dos tercios más un cuarto jamás puede ser tres séptimos?
  tex: \frac{2}{3} + \frac{1}{4} \neq \frac{3}{7}
  emoji: 😱
enunciado:
  texto: Calcula 2/3 + 1/4 encontrando el mínimo común múltiplo entre los denominadores.
  voz: Para sumar fracciones necesitas pedazos del mismo tamaño, no sumar numeradores y denominadores hacia el lado.
  destacar:
  - "2/3 + 1/4"
datos:
- tex: \text{mcm}(3, 4) = 12
  voz: El mínimo común múltiplo entre tres y cuatro es doce.
pasos:
- nota: La creencia falsa
  tex: \frac{2 + 1}{3 + 4} = \frac{3}{7}
  voz: Sumar dos más uno y tres más cuatro da tres séptimos. ¡Eso está completamente prohibido!
  error: true
  emoji: ❌
- nota: Amplificar a doceavos
  tex: \frac{2 \cdot 4}{3 \cdot 4} + \frac{1 \cdot 3}{4 \cdot 3} = \frac{8}{12} + \frac{3}{12}
  voz: "Convertimos a doceavos: dos tercios son ocho partes, y un cuarto son tres partes."
  emoji: 💡
  visual:
    tipo: barras
    categorias: ['Dos tercios 8', 'Un cuarto 3', 'Suma 11', 'Entero 12']
- nota: Sumar pedazos iguales
  tex: \frac{8 + 3}{12} = \frac{11}{12}
  voz: Ahora que los trozos son iguales, sumamos ocho más tres y obtenemos once doceavos.
  destacar:
  - \frac{11}{12}
  emoji: ✅
  visual:
    tipo: barras
    categorias: ['Dos tercios 8', 'Un cuarto 3', 'Suma 11', 'Entero 12']
resultado:
  tex: \frac{2}{3} + \frac{1}{4} = \frac{11}{12}
  voz: El resultado correcto es once doceavos. Tres séptimos ni siquiera llegaba a la mitad.
  emoji: 🎯
verificacion:
  texto: 11/12 es casi el entero (0,92), mientras que 3/7 es menos de la mitad (0,43).
  voz: Once doceavos es casi el entero completo, mientras que tres séptimos no alcanzaba ni a la mitad.
reto:
  texto: ¿Cuánto da 1/2 + 1/3? ¿Da 2/5 o 5/6?
  voz: ¿Cuánto da un medio más un tercio? ¿Dos quintos o cinco sextos? Cuéntame abajo.
  emoji: 🤔
