enunciado:
  texto: "Halla el centro de gravedad de una placa triangular con vértices A(0, 0), B(6, 0) y C(3, 9)."
  voz: "Estás armando una pieza y necesitas hallar su centro de gravedad."
  destacar: ["A(0, 0)", "B(6, 0)", "C(3, 9)"]

datos:
