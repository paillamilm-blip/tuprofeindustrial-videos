    voz: "El vértice a en cero coma cero."
  - tex: 'B(6, 0)\ \text{cm}'
    voz: "El vértice b en seis coma cero."
  - tex: 'C(3, 9)\ \text{cm}'
    voz: "El vértice c en tres coma nueve."

pasos:
  - nota: "Coordenada equis"
    tex: 'x_c = \frac{0 + 6 + 3}{3}'
    voz: "Sumamos las posiciones equis y dividimos por tres."
    emoji: "📐"
  - nota: "Coordenada i griega"
    tex: 'y_c = \frac{0 + 0 + 9}{3}'
    voz: "Hacemos lo mismo con las posiciones verticales."
  - nota: "Resultado final"
    tex: 'C_g = (3, 3)\ \text{cm}'
    voz: "Obtenemos las coordenadas finales del punto de equilibrio."
    emoji: "🏆"

resultado:
