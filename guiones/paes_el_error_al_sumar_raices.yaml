titulo: 'PAES M1: El error típico al sumar raíces'
materia: matematica
nivel: 1° medio / PAES
molde: mito_realidad
tema: consola_error
camara: suave
gancho:
  texto: "¿Por qué √9 + √16 NO es √25?"
  voz: "¿Por qué raíz de nueve más raíz de dieciséis nunca da raíz de veinticinco? ¡La trampa clásica de la PAES!"
  tex: '\sqrt{9} + \sqrt{16} \stackrel{?}{=} \sqrt{25}'
  emoji: ⚠️
enunciado:
  texto: "En la PAES aparece la expresión: \\sqrt{9} + \\sqrt{16}. ¿Cuál es su valor real?"
  voz: "Típica pregunta trampa de la prueba: calcula el valor de raíz de nueve más raíz de dieciséis."
  destacar:
  - "\\sqrt{9}"
  - "\\sqrt{16}"
datos:
- tex: E = \sqrt{9} + \sqrt{16}
  voz: Tenemos una suma de dos raíces cuadradas exactas.
pasos:
- nota: La trampa que todos marcan
  tex: \sqrt{9} + \sqrt{16} = \sqrt{9 + 16} = \sqrt{25} = 5
  voz: "El error clásico es juntar todo bajo una sola raíz y marcar cinco. ¡Eso está matemáticamente prohibido!"
  emoji: ❌
  error: true
- nota: La regla de oro
  tex: \sqrt{a + b} \neq \sqrt{a} + \sqrt{b}
  voz: "¡Cuidado! Las raíces se pueden juntar al multiplicar, pero jamás en una suma."
  emoji: 💡
  visual:
    tipo: barras
    categorias: ['Raiz de 9 3', 'Raiz de 16 4', 'Suma real 7', 'Error trampa 5']
- nota: Calculamos por separado
  tex: 3 + 4 = 7
  voz: "Lo correcto es resolver cada una: tres más cuatro nos da el resultado verdadero, siete."
  destacar:
  - "7"
  emoji: ✅
  visual:
    tipo: barras
    categorias: ['Raiz de 9 3', 'Raiz de 16 4', 'Suma real 7', 'Error trampa 5']
resultado:
  tex: \sqrt{9} + \sqrt{16} = 7 \neq 5
  voz: La respuesta correcta es siete. El cinco es solo el distractor de la prueba.
  emoji: 🎯
verificacion:
  texto: Siete al cuadrado es 49, mientras que 9 + 16 es 25. Son números totalmente distintos.
  voz: Siete al cuadrado es cuarenta y nueve, no veinticinco. Las raíces cuadradas no se suman.
reto:
  texto: "¿Cuánto es \\sqrt{100} - \\sqrt{64}? ¿Da 2 o da 6?"
  voz: "Ahora para ti: ¿cuánto da raíz de cien menos raíz de sesenta y cuatro? ¿Da dos o da seis? Déjalo en los comentarios."
  emoji: 🤔
