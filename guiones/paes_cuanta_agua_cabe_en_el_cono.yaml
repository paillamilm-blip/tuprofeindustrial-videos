# Guion armónico de Geometría PAES M1 / M2
# Con sólidos 3D paso a paso, visual vivo, música lofi y cero engagement bait

titulo: "PAES M1: ¿Cuánta agua cabe en el cono de papel?"
materia: matematica
nivel: "PAES M1"
molde: nadie_te_enseno

gancho:
  texto: "El vaso cónico guarda un tercio de lo que imaginas"
  voz: "El cono de papel para el agua engaña a la vista: guarda solo un tercio de lo que imaginas."
  emoji: "🥤"

enunciado:
  texto: "Un vaso cónico de papel tiene radio 3 cm y altura 4 cm. Calcula cuánta agua cabe adentro."
  voz: "Mira este vaso cónico de radio tres centímetros y altura cuatro centímetros. ¿Cuánta agua cabe?"
  destacar: ["3 cm", "4 cm"]

datos:
  - tex: 'r = 3\ \text{cm}'
    voz: "El radio del borde circular mide tres centímetros."
  - tex: 'h = 4\ \text{cm}'
    voz: "Y la altura total del cono es cuatro centímetros."

pasos:
  - nota: "La base circular que lo abre"
    tex: 'A_{base} = \pi r^2 \approx 28{,}27\ \text{cm}^2'
    voz: "Primero miramos el círculo de la base: pi por tres al cuadrado da casi veintiocho coma tres centímetros cuadrados."
    visual:
      tipo: solido_3d
      figura: cono
      radio: '3 cm'
      altura: '4 cm'
      vista: piso
  - nota: "La fórmula del cono: un tercio"
    tex: 'V = \frac{1}{3}\pi r^2 h = \frac{1}{3}(28{,}27)(4) \approx 37{,}7\ \text{cm}^3'
    voz: "Segundo, el volumen: es un tercio de la base por la altura. Nos da casi treinta y ocho centímetros cúbicos."
    visual:
      tipo: solido_3d
      figura: cono
      radio: '3 cm'
      altura: '4 cm'
      vista: axonometrica
      anotar: ['volumen']
  - nota: "La pared inclinada: trío pitagórico"
    tex: 'g = \sqrt{r^2 + h^2} = \sqrt{3^2 + 4^2} = 5\ \text{cm}'
    voz: "Tercero: el papel de la pared forma el triángulo tres, cuatro y cinco. La generatriz mide cinco centímetros."
    visual:
      tipo: solido_3d
      figura: cono
      radio: '3 cm'
      altura: '4 cm'
      vista: axonometrica
      anotar: ['area']

resultado:
  tex: 'V \approx 37{,}7\ \text{cm}^3 \approx 38\ \text{ml}'
  voz: "Treinta y ocho centímetros cúbicos: exactamente treinta y ocho mililitros de agua."
  emoji: "🎯"

verificacion:
  texto: "Mucho menor que el cilindro que lo envuelve (113 cm³): exactamente su tercera parte."
  voz: "Comprobación: el cilindro envolvente guardaría ciento trece. El cono guarda un tercio: calza perfecto."

reto:
  texto: "Si duplicas la altura a 8 cm manteniendo el radio, ¿cuánta agua cabe ahora?"
  voz: "Ahora para ti: si duplicamos la altura a ocho centímetros manteniendo el radio, ¿cuánta agua cabe? Piénsalo antes del próximo video."
  emoji: "✍️"
