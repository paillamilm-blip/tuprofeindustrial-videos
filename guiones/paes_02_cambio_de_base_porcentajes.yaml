titulo: 'PAES M1: El mito del 20% que baja y sube'
materia: matematica
nivel: 1° medio / PAES
molde: mito_realidad
tema: consola_error
camara: suave
gancho:
  texto: Si baja un 20% y sube un 20%, ¿queda igual?
  voz: Si un precio baja veinte por ciento y después sube veinte por ciento, ¿queda igual?
  tex: 100 - 20\% + 20\% \neq 100
  emoji: 🚨
enunciado:
  texto: Un producto de $100 baja un 20% y luego el nuevo precio sube un 20%. ¿Queda igual?
  voz: Cien pesos bajan veinte por ciento y luego suben veinte por ciento. Muchos creen que queda igual.
  destacar:
  - "100"
  - "20%"
datos:
- tex: P_0 = 100
  voz: Partimos de cien pesos.
pasos:
- nota: La creencia falsa
  tex: P_{\text{final}} = 100
  voz: El error común es creer que los porcentajes se anulan. ¡Eso está mal!
  error: true
  emoji: ❌
- nota: Primer cambio (baja 20%)
  tex: P_1 = 100 - 20 = 80
  voz: Al bajar un veinte por ciento de cien, te quedan ochenta pesos.
  emoji: 📉
  visual:
    tipo: barras
    categorias: ['Base 100', 'Baja 80', 'Final 96']
- nota: Segundo cambio (sube 20% sobre 80)
  tex: P_2 = 80 + 0{,}2 \cdot 80 = 80 + 16 = 96
  voz: La subida se calcula sobre ochenta, no sobre cien. Veinte por ciento de ochenta es dieciséis.
  destacar:
  - '96'
  emoji: 💡
  visual:
    tipo: barras
    categorias: ['Base 100', 'Baja 80', 'Final 96']
resultado:
  tex: P_{\text{final}} = 96 \neq 100
  voz: El precio final es noventa y seis. ¡Perdiste un cuatro por ciento en el camino!
  emoji: 🎯
verificacion:
  texto: La base sobre la que calculas el porcentaje cambió de 100 a 80.
  voz: La base cambió. Por eso nunca da el cien por ciento original.
reto:
  texto: Si algo cuesta 200, ¿sube 10% y baja 10% queda en 200?
  voz: Si cuesta doscientos, ¿sube diez por ciento y baja diez por ciento queda igual? Piénsalo.
  emoji: 🤔
cierre:
  texto: Clases particulares PAES M1. Escríbeme directo al WhatsApp de mi perfil.
  voz: Si quieres asegurar tu puntaje en la PAES M1, háblame directo al WhatsApp que está en mi perfil.
  emoji: 🔥
llamado: Clases particulares PAES · Online y presencial · WhatsApp en mi perfil (link en bio)
