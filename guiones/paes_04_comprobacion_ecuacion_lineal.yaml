titulo: 'PAES M1: ¿Cómo comprobar tu ecuación?'
materia: matematica
nivel: "PAES M1"
tema: consola_pasos
camara: quieta

gancho:
  texto: "¡Nunca entregues una ecuación sin comprobar!"
  voz: "¡Nunca entregues una ecuación en la PAES sin comprobar! Te toma diez segundos y asegura tus puntos."
  tex: '3x + 2 = 14'
  emoji: "🎯"

enunciado:
  texto: "Resuelve la ecuación 3x + 2 = 14 y verifica el resultado sustituyendo en la igualdad original."
  voz: "Resolvemos tres equis más dos igual a catorce y la verificamos de inmediato."
  destacar:
    - "3x + 2 = 14"

pasos:
  - nota: "Error típico al despejar"
    tex: '3x = 14 + 2 \rightarrow 3x = 16'
    voz: "El error común: pasar el dos sumando y decir tres equis igual a dieciséis."
    error: true
    emoji: "❌"

  - nota: "Paso 1: Despejar x correctamente"
    tex: '3x = 14 - 2 \rightarrow 3x = 12 \rightarrow x = 4'
    voz: "El dos pasa restando: tres equis es doce, por lo tanto equis vale cuatro."
    destacar:
      - 'x = 4'
    emoji: "💡"
    visual:
      tipo: grafico_funcion
      funcion: '3x + 2'
      variable: x
      rango: [0, 5]
      eje_x: "x"
      eje_y: "3x + 2"
      marcar: [4]

  - nota: "Paso 2: Comprobación por sustitución"
    tex: '3(4) + 2 = 12 + 2 = 14'
    voz: "Comprobamos reemplazando equis por cuatro: tres por cuatro doce, más dos catorce."
    destacar:
      - '12 + 2 = 14'
    emoji: "✅"
    visual:
      tipo: grafico_funcion
      funcion: '3x + 2'
      variable: x
      rango: [0, 5]
      eje_x: "x"
      eje_y: "3x + 2"
      marcar: [4]

resultado:
  tex: '14 = 14 \quad \checkmark \quad (x = 4)'
  voz: "Catorce es igual a catorce: la solución es correcta y tu puntaje está asegurado."
  emoji: "🏆"

verificacion:
  texto: "Sustituir en la ecuación original valida cualquier solución sin dudar."
  voz: "Sustituir en la ecuación original te da certeza absoluta antes de marcar tu respuesta."

reto:
  texto: "¿Cuánto vale x en 4x - 5 = 11? ¿Comprobaste tu resultado?"
  voz: "Ahora tú: en cuatro equis menos cinco igual a once, ¿cuánto vale equis? Compruébalo y háblame al WhatsApp de mi perfil."
  emoji: "✍️"

portada:
  estilo: cian
  badge: "PAES M1 · ADMISIÓN 2027"
  emoji_badge: cronometro.png
  titular: |-
    ¿CÓMO REVISAR
    TU ECUACIÓN?
  pregunta: "¿3x + 2 = 14 EN 10 SEGUNDOS?"
  alerta: "¡NO ENTREGUES SIN COMPROBAR!"
  emoji_alerta: objetivo.png
  detalle: "3(4) + 2 = 12 + 2 = 14 ✓"
  pie: "Asegura tus puntos reemplazando tu resultado"

historias:
