# Guion escrito a mano el 27-10-2026 para estrenar la polea de Atwood.
# REVISA la matemática antes de publicar.

titulo: "Las dos masas que se bajan una a la otra"
materia: fisica
nivel: "2° medio"
molde: nadie_te_enseno
tema: cuaderno_del_profe

gancho:
  texto: "Suelta las dos masas y ninguna cae libre"
  voz: "Dos masas colgadas de una polea: ninguna hace lo que quiere."
  emoji: "⚙️"

enunciado:
  texto: "Una polea une 3 kg y 2 kg con una cuerda que no pesa ni se estira."
  voz: "De un lado tres kilos, del otro dos. La cuerda no pesa y no se estira."
  destacar: ["3 kg", "2 kg"]

datos:
  - tex: 'm_1 = 3\ \text{kg} \quad m_2 = 2\ \text{kg} \quad g = 9{,}8\ \text{m/s}^2'
    voz: "Tres kilos contra dos, y la gravedad empuja con nueve coma ocho."

pasos:
  - nota: "Lo que desequilibra el sistema"
    tex: 'F = (m_1 - m_2)\,g = 9{,}8\ \text{N}'
    voz: "Un kilo de diferencia pesa nueve coma ocho newtons."
  - nota: "Esa fuerza mueve los cinco kilos"
    tex: 'a = \frac{(m_1 - m_2)\,g}{m_1 + m_2} = 1{,}96\ \text{m/s}^2'
    voz: "Nueve coma ocho repartido en cinco kilos: todos se mueven a uno coma noventa y seis."
    visual:
      tipo: polea
      masa_a: '3 kg'
      masa_b: '2 kg'
      anotar: ['aceleracion', 'tension']
  - nota: "La cuerda frena la caída del lado pesado"
    tex: 'T = m_2 (g + a) = 2 \cdot 11{,}76 = 23{,}52\ \text{N}'
    voz: "El lado liviano sube: la cuerda lo tira con veintitrés coma cinco dos newtons."

resultado:
  tex: 'a = 1{,}96\ \text{m/s}^2 \quad T = 23{,}52\ \text{N}'
  voz: "Ninguno cae libre: bajan acelerados y la cuerda comparte el peso."
  emoji: "💡"

verificacion:
  texto: "3 · 9,8 − 23,52 = 5,88 = 3 · 1,96: el lado pesado cuadra."
  voz: "Veintinueve coma cuatro menos veintitrés coma cinco dos: cinco coma ocho ocho, lo mismo."

reto:
  texto: "¿Qué masas hacen que la polea acelere a g/2?"
  voz: "Ahora tú: qué masas hacen que esta polea acelere a la mitad de la gravedad."
  emoji: "✍️"
