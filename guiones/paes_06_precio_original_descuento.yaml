titulo: 'PAES M1: ¿Cuál era el precio original?'
materia: matematica
nivel: "PAES M1"
molde: mito_realidad
camara: quieta

gancho:
  texto: "Con 20% de descuento pagaste $16.000. ¿Cuál era el precio original?"
  voz: "Con veinte por ciento de descuento pagaste dieciséis mil pesos. ¿Cuál era el precio original?"
  tex: 'P - 20\% = \$16.000 \rightarrow P = \text{¿?}'
  emoji: "📉"

enunciado:
  texto: "Determina el valor inicial P de un producto si tras un 20% de rebaja su precio final es $16.000."
  voz: "El error que comete casi todo el mundo es sumarle el veinte por ciento a los dieciséis mil."
  destacar:
    - "$16.000"
    - "20%"

pasos:
  - nota: "La creencia falsa"
    tex: '16.000 + 0{,}20(16.000) = 19.200'
    voz: "Calcular el veinte por ciento de dieciséis mil y sumarlo te da diecinueve mil doscientos. ¡Eso está pésimo!"
    error: true
    emoji: "❌"

  - nota: "Paso 1: Plantear la fracción que pagas"
    tex: '100\% - 20\% = 80\% \rightarrow 0{,}80 \cdot P = 16.000'
    voz: "Si te descontaron el veinte por ciento, lo que pagaste en caja equivale al ochenta por ciento del total pe."
    destacar:
      - '0{,}80 \cdot P = 16.000'
    emoji: "💡"

  - nota: "Paso 2: Despejar el precio original"
    tex: 'P = \frac{16.000}{0{,}80} \rightarrow P = 20.000'
    voz: "Despejamos pe dividiendo dieciséis mil entre cero coma ocho, y obtenemos exactamente veinte mil pesos."
    destacar:
      - 'P = 20.000'
    emoji: "✅"

resultado:
  tex: '\text{Precio original} = \$20.000'
  voz: "El precio original era de veinte mil pesos. Ni diecinueve mil ni dieciocho mil."
  emoji: "🏆"

verificacion:
  texto: "Comprobación: el 20% de $20.000 son $4.000, y $20.000 - $4.000 = $16.000."
  voz: "Comprobémoslo: el veinte por ciento de veinte mil son cuatro mil, y veinte mil menos cuatro mil da dieciséis mil."

reto:
  texto: "¿Y si pagas $24.000 con 20% de descuento? ¿Cuánto costaba?"
  voz: "Ahora tú: si pagaste veinticuatro mil con veinte por ciento de descuento, ¿cuál era el precio original? Deja tu cálculo en los comentarios."
  emoji: "✍️"

cierre:
  texto: "Clases particulares PAES M1 · Escríbeme al WhatsApp de mi perfil"
  voz: "Si quieres asegurar tu puntaje para la Admisión 2027, háblame directo al WhatsApp que está en mi perfil."
  emoji: "🔥"

