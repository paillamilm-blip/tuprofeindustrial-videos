gancho:
  texto: "¿Por qué esta fracción se vuelve cuadrática?"
  voz: "¿Por qué una suma de fracciones simples termina convirtiéndose en una ecuación cuadrática?"
  emoji: "🤔"

gancho_variantes:
  - texto: "¿Cometes este error en ecuaciones fraccionarias?"
    voz: "¿Cometes este error clásico al transformar fracciones en una cuadrática? Vamos a revisarlo."
    emoji: "⚠️"
    tex: '\frac{2}{x} + \frac{1}{x-2} = 1'
  - texto: "No olvides multiplicar el lado derecho"
    voz: "Muchos olvidan multiplicar el lado derecho de la ecuación por el denominador común."
    emoji: "🚨"

enunciado:
  texto: "Resuelve la ecuación fraccionaria 2/x + 1/(x-2) = 1 y determina sus soluciones."
  voz: "Tenemos la ecuación fraccionaria dos dividido en equis más uno dividido en equis menos dos, igual a uno."
  destacar: ["2/x + 1/(x-2) = 1"]

datos:
  - tex: 'x \neq 0, \quad x \neq 2'
    voz: "Primero recordamos que equis no puede ser cero ni dos para no dividir por cero."

pasos:
  - nota: "Error típico"
    tex: '2(x-2) + x = 1'
    voz: "El error más común es multiplicar cruzado a la izquierda, pero olvidar multiplicar el uno de la derecha por el denominador."
    destacar: ['1']
    emoji: "❌"
    error: true   # error típico: se muestra tachado
  - nota: "Multiplicar por el MCM"
    tex: 'x(x-2) \left( \frac{2}{x} + \frac{1}{x-2} \right) = 1 \cdot x(x-2)'
    voz: "Lo correcto es multiplicar ambos lados completos por el mínimo común múltiplo, equis por equis menos dos."
    destacar: ['x(x-2)']
    halo: ['x(x-2)']
    emoji: "💡"
    mapa:
      - termino: "x(x-2)"
        concepto: "mínimo común múltiplo"
  - nota: "Simplificamos"
    tex: '2(x-2) + x = x(x-2)'
    voz: "Al simplificar, cada término queda multiplicado por el denominador común, asegurando la igualdad."
    destacar: ['x(x-2)']
    resaltar_cambio: true
  - nota: "Ecuación cuadrática"
    tex: 'x^2 - 5x + 4 = 0'
    voz: "Desarrollamos los paréntesis y reordenamos todos los términos para llegar a la cuadrática correcta."
    destacar: ['x^2 - 5x + 4 = 0']
    halo: ['x^2 - 5x + 4 = 0']
    resaltar_cambio: true
    emoji: "✅"

resultado:
  tex: 'x_1 = 4, \quad x_2 = 1'
  texto: "Multiplicar ambos miembros por el denominador común permite llegar a la cuadrática correcta sin perder términos."
  voz: "Las soluciones son equis igual a cuatro y equis igual a uno."
  emoji: "🎯"
  destello: true

verificacion:
  texto: "Reemplazando x = 4: 2/4 + 1/2 = 1/2 + 1/2 = 1. Se cumple la igualdad."
  voz: "Si reemplazas cuatro, obtienes dos cuartos más un medio, que suma exactamente uno."

reto:
