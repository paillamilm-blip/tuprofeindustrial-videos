# Guion escrito a mano para estrenar el dibujo "vector_3d" (vector dentro de una caja).
# El motor calcula solo: piso = 5 y norma = 13 del vector (3, 4, 12).
# Las cuentas de cada paso viven en el tex; el dibujo pone las etiquetas x, y, z, piso y v.

titulo: "El vector dentro de la caja"
materia: matematica
nivel: "3° medio"

gancho:
  texto: "El largo de este vector no es 19"
  voz: "Sumas tres, cuatro y doce y te sale diecinueve. Ese número no es el largo del vector."
  emoji: "🎯"

enunciado:
  texto: "Un vector sale de un rincón de una caja y llega al rincón opuesto: 3 cm en x, 4 cm en y y 12 cm en z. ¿Cuánto mide?"
  voz: "Un vector arranca en un rincón de la caja y termina en el rincón opuesto. Tres centímetros en x, cuatro en y y doce en z."
  destacar: ["3 cm", "4 cm", "12 cm"]

datos:
  - tex: 'x = 3\ \text{cm}'
    voz: "La primera componente mide tres centímetros."
  - tex: 'y = 4\ \text{cm}'
    voz: "La segunda, cuatro."
  - tex: 'z = 12\ \text{cm}'
    voz: "Y la tercera, doce."

pasos:
  - nota: "Las tres medidas viven dentro de la caja"
    tex: '\vec v = (3,\ 4,\ 12)'
    voz: "Ninguna de las tres va recta de un rincón al otro. Las tres son las paredes del camino."
    visual:
      tipo: vector_3d
      componentes: [3, 4, 12]
      unidad: "cm"
      anotar: []
  - nota: "Error típico"
    tex: 'L = 3 + 4 + 12 = 19\ \text{cm}'
    voz: "Sumarlas da diecinueve, y ese número no es un largo: es una vuelta por tres paredes."
    destacar: ['+']
    emoji: "❌"
    error: true
  - nota: "Primero pisas el piso"
    tex: 'p = \sqrt{3^2 + 4^2} = \sqrt{25} = 5\ \text{cm}'
    voz: "En el piso del cajón, tres y cuatro forman una esquina: su diagonal mide cinco."
    visual:
      tipo: vector_3d
      componentes: [3, 4, 12]
      unidad: "cm"
      anotar: [piso]
  - nota: "Y con esa diagonal subes recto"
    tex: 'v = \sqrt{5^2 + 12^2} = \sqrt{169} = 13\ \text{cm}'
    voz: "Esa diagonal de cinco y la pared de doce son otra esquina. Su hipotenusa es el vector: trece."
    visual:
      tipo: vector_3d
      componentes: [3, 4, 12]
      unidad: "cm"
      anotar: [piso, norma]

resultado:
  tex: 'v = 13\ \text{cm} \neq 19'
  voz: "El vector mide trece centímetros. Las dos Pitágoras seguidas, no una suma."
  emoji: "✅"

verificacion:
  texto: "Dos tercias pitagóricas encadenadas: 3-4-5 en el piso y 5-12-13 en el aire. Y 13² = 169 = 25 + 144."
  voz: "Revisa con las tercias de siempre: tres, cuatro y cinco abajo; cinco, doce y trece arriba. Y el trece al cuadrado junta ciento sesenta y nueve, que es lo mismo que veinticinco más ciento cuarenta y cuatro."

reto:
  texto: "Si las componentes fueran 6, 8 y 24 cm, ¿cuánto mide el piso y cuánto el vector?"
  voz: "Con seis, ocho y veinticuatro: ¿cuánto pisa el piso y cuánto vale el vector?"
  emoji: "✍️"
