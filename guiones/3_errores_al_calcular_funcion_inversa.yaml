enunciado:
  texto: "Dada la función f(x) = 2x + 3, encuentra su función inversa f⁻¹(x)."
  voz: "Dada la función efe de equis igual a dos equis más tres, encuentra su función inversa."
  destacar: ["f(x) = 2x + 3", "f⁻¹(x)"]

datos:
  - tex: 'f(x) = 2x + 3'
    voz: "Tenemos la función original efe de equis igual a dos equis más tres."

pasos:
  - nota: "Error 1: Recíproca"
    tex: 'f^{-1}(x) = \frac{1}{2x + 3}'
    voz: "Primer error: pensar que el exponente menos uno significa dividir uno por la función."
    emoji: "❌"
    error: true   # error típico: se muestra tachado
  - nota: "Error 2: Cambiar signo"
    tex: 'f^{-1}(x) = -(2x + 3)'
    voz: "Segundo error: creer que la inversa consiste en cambiarle los signos a la expresión."
    emoji: "❌"
    error: true   # error típico: se muestra tachado
  - nota: "Error 3: Sin despejar"
    tex: 'f^{-1}(x) = 2y + 3'
    voz: "Tercer error: cambiar equis por y pero olvidarse de despejar la ecuación."
    emoji: "❌"
    error: true   # error típico: se muestra tachado
  - nota: "Despejar la x"
    tex: 'y = 2x + 3 \Rightarrow x = \frac{y - 3}{2}'
    voz: "La forma correcta: igualamos a y, restamos tres y dividimos en dos para despejar equis."
    resaltar_cambio: true
    emoji: "💡"
    mapa:
      - termino: "y"
        concepto: "variable dependiente"
      - termino: "x"
        concepto: "variable a despejar"
  - nota: "Intercambiar variables"
    tex: 'f^{-1}(x) = \frac{x - 3}{2}'
    voz: "Finalmente, cambiamos la y por equis y obtenemos la verdadera función inversa."
    halo: ['f^{-1}(x)']
    resaltar_cambio: true
    emoji: "✅"

resultado:
  tex: 'f^{-1}(x) = \frac{x - 3}{2}'
  texto: "La función inversa de f(x) = 2x + 3 es f⁻¹(x) = (x - 3) / 2."
  voz: "La función inversa de dos equis más tres es equis menos tres dividido en dos."
  emoji: "🎯"
  destello: true

verificacion:
  texto: "Si f(2) = 7, entonces f⁻¹(7) debe dar 2. Comprobamos: (7 - 3)/2 = 2."
  voz: "Comprobamos: si efe de dos da siete, la inversa de siete nos devuelve exactamente dos."

