#   - revisor: Matemática / Precisión: el cálculo de V = \pi (0,096 m)^2 \cdot 6 m es \pi \cdot 0,009216 \cdot 6 = 0,055296 \pi \approx 0,173673 m^3, que al convertir a litros da ~173,67 L (~174 L); sin embargo, la verificación menciona que sin espesor daría 188 L (el volumen exterior es \pi \cdot 0,1^2 \cdot 6 = 0,06 \pi \approx 0,188495 m^3 = 188,5 L), por lo que la diferencia es ~14,8 L (redondeado a 15 L, no 14 L).

titulo: "Agua en cañería de acero (Parte 1)"
materia: ingenieria
categoria: ingenieria  # sale de la materia; elige el estilo si no hay «tema»
