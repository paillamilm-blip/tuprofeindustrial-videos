titulo: 'PAES M1: ¿Duplicas obreros o días?'
materia: matematica
nivel: "PAES M1"
molde: mito_realidad
camara: quieta

gancho:
  texto: "¿4 obreros en 6 días? ¿Cuánto tardan 8?"
  voz: "Si cuatro obreros tardan seis días, ¿cuánto tardan ocho? ¡El error más común de la PAES!"
  tex: '4\ \text{obreros} \rightarrow 6\ \text{días} \quad | \quad 8\ \text{obreros} \rightarrow \text{¿?}'
  emoji: "🏗️"

enunciado:
  texto: "Calcula el tiempo que demoran 8 personas si 4 personas completan la misma tarea en 6 días."
  voz: "Al tener más personas trabajando, la carga se reparte y el tiempo disminuye, no aumenta."
  destacar:
    - "4 personas"
    - "6 días"

datos:
  - tex: 'k = 4 \cdot 6 = 24'
    voz: "La constante de trabajo es cuatro por seis, igual a veinticuatro."

pasos:
  - nota: "La creencia falsa"
    tex: '8\ \text{personas} \rightarrow 12\ \text{días}'
    voz: "El error común: responder doce días usando regla de tres directa. ¡Con más gente jamás tardarás más tiempo!"
    error: true
    emoji: "❌"

  - nota: "Proporcionalidad inversa"
    tex: '\text{obreros} \cdot \text{días} = 24'
    voz: "Es proporción inversa: la multiplicación de obreros por días siempre da veinticuatro."
    emoji: "💡"
    visual:
      tipo: barras
      categorias: ['4 obreros 6', 'Error 12', '8 obreros 3']

  - nota: "Calculamos los días reales"
    tex: 'd = \frac{24}{8} \implies d = 3\ \text{días}'
    voz: "Despejamos los días: veinticuatro dividido en ocho nos da tres días exactos. ¡El tiempo se redujo a la mitad!"
    destacar:
      - 'd = 3\ \text{días}'
    emoji: "✅"
    visual:
      tipo: barras
      categorias: ['4 obreros 6', 'Error 12', '8 obreros 3']

resultado:
  tex: 'd = 3\ \text{días} \quad (\neq 12\ \text{días})'
  voz: "La respuesta correcta son tres días: a más obreros, menos tiempo de trabajo."
  emoji: "🏆"

verificacion:
  texto: "En proporción inversa: al duplicar los obreros (×2), los días se dividen por la mitad (÷2)."
  voz: "Si duplicas los trabajadores, los días de trabajo se cortan exactamente a la mitad."

reto:
  texto: "¿Y si fueran 12 obreros? ¿Cuántos días tardan? Te leo abajo."
  voz: "Ahora tú: ¿cuántos días tardarían doce obreros en la misma obra? Deja tu respuesta en los comentarios."
  emoji: "✍️"

cierre:
  texto: "Clases particulares PAES M1 · Escríbeme al WhatsApp de mi perfil"
  voz: "Si quieres asegurar tu puntaje para la Admisión 2027, háblame directo al WhatsApp que está en mi perfil."
  emoji: "🔥"

portada:
  estilo: naranja
  badge: "PAES M1 · ADMISIÓN 2027"
  emoji_badge: construccion.png
  titular: |-
    ¿4 OBREROS EN 6 DÍAS?
    ¿CUÁNTO TARDAN 8?
