  alerta: "¡NO ES DIRECTA! ¡ES INVERSA!"
  emoji_alerta: incorrecto.png
  detalle: "4 × 6 = 24  →  24 ÷ 8 = 3 días"
  pie: "A más trabajadores, menos días de trabajo"

historias:
