titulo: 'PAES M1: ¿Duplicas trabajadores o duplicas días?'
materia: matematica
nivel: 1° medio / PAES
molde: mito_realidad
tema: consola_error
camara: suave
gancho:
  texto: "¿4 obreros en 6 días? ¿Cuánto tardan 8 obreros?"
  voz: "Si cuatro obreros tardan seis días en una obra, ¿cuánto tardan ocho obreros? ¡El error más común de la prueba!"
  tex: 4\ \text{pers.} \rightarrow 6\ \text{días} \quad|\quad 8\ \text{pers.} \rightarrow ¿?
  emoji: 🏗️
enunciado:
  texto: Calcula el tiempo que demoran 8 personas si 4 personas completan la misma tarea en 6 días.
  voz: Al tener más personas trabajando, el trabajo se reparte y el tiempo disminuye, no aumenta.
  destacar:
  - "4 personas"
  - "6 días"
datos:
- tex: k = 4 \cdot 6 = 24
  voz: La constante de trabajo es cuatro por seis, veinticuatro.
pasos:
- nota: La creencia falsa
  tex: 8\ \text{personas} \rightarrow 12\ \text{días}
  voz: Responder doce días aplicando regla de tres directa es un grave error. ¡Jamás tardarás más tiempo con más gente!
  error: true
  emoji: ❌
- nota: Proporcionalidad inversa
  tex: \text{obreros} \cdot \text{días} = 24
  voz: "Es proporcionalidad inversa: personas por días siempre da veinticuatro."
  emoji: 💡
  visual:
    tipo: barras
    categorias: ['4 obreros 6', 'Error directo 12', 'Real 8 obreros 3']
- nota: Calculamos los días reales
  tex: d = \frac{24}{8} = 3\ \text{días}
  voz: Veinticuatro dividido entre ocho nos da tres días exactos. ¡El tiempo se redujo a la mitad!
  destacar:
  - "3"
  emoji: ✅
  visual:
    tipo: barras
    categorias: ['4 obreros 6', 'Error directo 12', 'Real 8 obreros 3']
resultado:
  tex: d = 3\ \text{días} \neq 12\ \text{días}
  voz: La respuesta correcta son tres días, no doce.
  emoji: 🎯
verificacion:
  texto: En proporción inversa, si multiplicas los obreros por 2, los días se dividen por 2.
  voz: Si duplicas los trabajadores, los días de trabajo se cortan exactamente a la mitad.
reto:
  texto: "¿Y si fueran 12 obreros? ¿Cuántos días tardan? Te leo abajo."
  voz: "Ahora tú: ¿cuántos días tardarían doce obreros en la misma obra? Deja tu respuesta abajo."
  emoji: 🤔
cierre:
  texto: Clases particulares PAES M1. Háblame directo al WhatsApp de mi perfil.
  voz: Si quieres asegurar tu puntaje en la M1 para la Admisión 2027, háblame directo al WhatsApp que está en mi perfil.
  emoji: 🔥
llamado: Clases particulares PAES · Online y presencial · WhatsApp en mi perfil (link en bio)
